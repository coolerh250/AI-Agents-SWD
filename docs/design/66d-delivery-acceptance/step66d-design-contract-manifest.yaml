router_convention:
  observed: ":colonCamelCase params, flat kebab-case root paths"
  source: "apps/admin-console/src/App.tsx"

semantic_routes:
  - scope: "cross-project"
    name: "Delivery Inbox"
    route: "/delivery-inbox"
    current_state: "PLACEHOLDER"
  - scope: "project-level"
    name: "Unified Control Center"
    route: "/projects/:projectId/control-center"
    current_state: "PLANNED_NOT_IMPLEMENTED"
  - scope: "submission-level"
    name: "Delivery Review"
    route: "/delivery-submissions/:deliverySubmissionId/review"
    current_state: "PLANNED_NOT_IMPLEMENTED"
  - scope: "superseded"
    name: "Delivery Detail (id-less placeholder)"
    route: "/delivery-detail"
    current_state: "PLACEHOLDER_SUPERSEDED_BY_REVIEW_ROUTE"

page_responsibilities:
  delivery_inbox:
    is: "cross-project queue of pending DeliveryReviewTask"
    is_not: ["project dashboard", "artifact browser", "decision-history archive", "specialist evidence surface"]
    write_actions: "none"
  unified_control_center:
    is: "project-level primary product entry point; goal-to-decision context and evidence index"
    is_not: ["duplicate of specialized routes", "second agent execution viewer", "second task graph", "second audit explorer", "second safety center", "second DLQ console"]
    write_actions: "none"
  delivery_review:
    is: "single DeliverySubmission review workspace; review actions, PO decision, follow-ups"
    is_not: ["cross-project queue", "project-wide overview"]
    write_actions: "FE2 only, NOT AUTHORIZED"

canonical_statuses:
  - DRAFT
  - SUBMITTED
  - UNDER_REVIEW
  - CHANGES_REQUESTED
  - QA_RERUN_REQUESTED
  - ACCEPTED
  - REJECTED
  - ARCHIVED
  - EXPIRED

review_gate_actions:
  - ACCEPT
  - REJECT
  - REQUEST_CHANGES
  - RERUN_QA
  - ESCALATE
  - ARCHIVE

product_owner_decisions:
  - ACCEPTED
  - ACCEPTED_WITH_FOLLOW_UP
  - REJECTED

action_decision_separation:
  separate_enums: true
  separate_ui_panels: true
  actions_without_decision: ["REQUEST_CHANGES", "RERUN_QA", "ESCALATE", "ARCHIVE"]
  atomic_pair: "ACCEPT/REJECT persist action + decision in one transaction (ADR-66D-10) but render as two records"

qa_rerun:
  limit_per_submission_version: 1
  counter_source: "backend-authoritative persisted DeliveryReviewAction rows"
  client_counter_allowed: false
  second_attempt_error: "409 QA_RERUN_LIMIT_REACHED"
  then_allowed: ["REQUEST_CHANGES", "ESCALATE", "REJECT"]

follow_up_rules:
  allowed_only_for: "ACCEPTED_WITH_FOLLOW_UP"
  blocking_item_allowed: false
  blocking_item_behavior: "block submit, no auto-conversion, direct user to REQUEST_CHANGES"
  server_error: "409 BLOCKING_FOLLOW_UP_REQUIRES_CHANGES"

expiry_rules:
  authority: "database-authoritative review_due_at"
  client_countdown: "hint only, labelled 'Estimated from server-provided due time'"
  disabled_when_expired: ["ACCEPT", "REJECT", "RERUN_QA", "REQUEST_CHANGES"]
  available_when_expired: ["ESCALATE", "ARCHIVE"]

required_states:
  - loading
  - empty
  - partial
  - stale
  - inaccessible
  - error
  - unknown
  - permission

evidence_health_states:
  - COMPLETE
  - PARTIAL
  - MISSING
  - STALE
  - INACCESSIBLE
  - UNKNOWN
unknown_render_rule: "UNKNOWN is never green, never PASS, never zero"

lifecycle_stages:
  - Goal
  - Requirements
  - Work Items
  - Execution
  - QA
  - Delivery Submission
  - Review
  - PO Decision
  - Follow-up
lifecycle_state_vocabulary:
  - not started
  - in progress
  - blocked
  - completed
  - failed
  - unknown
  - not applicable

dual_anchor_model:
  execution_lineage: "project_id -> work_item_id -> workflow_id -> run_id"
  human_review_anchor: "delivery_review_task_id -> task_id -> TASK_ROLES"
  control_center_anchor: "project_id"
  delivery_inbox_anchor: "delivery_review_task_id"
  delivery_review_anchor: "delivery_submission_id"
  task_is_agent_execution_source_of_truth: false

actor_types:
  - runtime_agent
  - ai_partner
  - human
  - system
ai_partners_are_runtime_agents: false

read_model:
  read_model_id: "project_delivery_control_center"
  consistency: "EVENTUALLY_CONSISTENT"
  required_fields: ["as_of", "is_stale"]
  missing_source_behavior: "UNKNOWN"
  authority_rule: "detailed authoritative route wins over Control Center summary"
  implemented: false

identity:
  today: "POC sandbox / internal test runtime operator identity"
  future: "verified shared-runtime identity, decided by RA-2, NOT IMPLEMENTED"
  request_provided_identity_authoritative: false
  final_decision_requires_verified_identity: true
  permission_states: ["authorized", "not authorized", "identity not verified", "capability unavailable", "read-only observer", "future shared-runtime requirement"]

deep_link_parameters:
  - project_id
  - primary_work_item_id
  - workflow_id
  - run_id
  - delivery_submission_id
  - delivery_review_task_id
  - artifact_id
  - return_to
url_forbidden_content: ["secret", "token", "credential", "actor identity", "capability claim", "unredacted sensitive evidence"]
return_behavior_preserves: ["project", "selected section", "filters", "expanded item where practical"]

deep_link_targets:
