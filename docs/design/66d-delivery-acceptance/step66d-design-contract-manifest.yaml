  - "/workspace"
  - "/incidents"

breakpoints: ["1440", "1280", "1024", "768"]
mobile_write_behavior: "read-only below 768px with an explicit unsupported-action message"
never_hidden_at_any_breakpoint: ["status", "blocking reason", "decision history"]

